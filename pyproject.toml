[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regime-hmm"
version = "0.1.0"
description = "From-scratch Gaussian Hidden Markov Model for market-regime characterization, with an honestly-null OOS regime-timing overlay (online-filter-only, never smoothed)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "FatihHekim0glu" }]
keywords = [
    "hidden-markov-model",
    "hmm",
    "market-regimes",
    "regime-switching",
    "quantitative-finance",
    "baum-welch",
    "deflated-sharpe",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
]

[project.urls]
Homepage = "https://fatihhekimoglu.com"
Repository = "https://github.com/FatihHekim0glu/regime-hmm"
Changelog = "https://github.com/FatihHekim0glu/regime-hmm/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Data path (Polygon EOD -> synthetic fallback) + transforms + cache.
# NB: hmmlearn is a DEV-ONLY parity oracle and is intentionally NOT here.
data = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "scikit-learn>=1.3",
    "pyarrow>=15.0",
    "diskcache>=5.6",
]
# Plotly figure builders (figures serialize to {data, layout} JSON).
viz = [
    "plotly>=5.20",
    "kaleido>=0.2.1",
]
# Developer + parity-oracle (hmmlearn) + lint/type/test stack.
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "hmmlearn>=0.3",
    "pandas-stubs>=2.0",
]

[project.scripts]
regime-hmm = "regimehmm.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/regimehmm"]

[tool.hatch.build.targets.sdist]
include = [
    "src/regimehmm",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
]

# --------------------------------------------------------------------------- #
# Ruff                                                                        #
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
    "NPY",  # numpy-specific
    "PD",   # pandas-vet
]
ignore = [
    "E501",    # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "N803", "N806"]  # math-style names (T, N, A) in tests
# The package __all__ is curated and grouped-with-comments by API area for
# readability; that intentional ordering is not the RUF022 natural sort.
"src/regimehmm/__init__.py" = ["RUF022"]

[tool.ruff.lint.pep8-naming]
# Math-style single-capital names (transition matrix A, sample count T/N, the
# Gaussian covariance Sigma) are intentional in the HMM kernel.
extend-ignore-names = ["A", "N", "T", "K", "Sigma"]

# --------------------------------------------------------------------------- #
# mypy (strict)                                                               #
# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
show_error_codes = true
files = ["src/regimehmm"]

# Documented pandas override: pandas-stubs is incomplete for some DataFrame
# operations; we accept untyped pandas internals at the boundary while keeping
# our own signatures strictly typed. (House convention: curated pandas suppression.)
[[tool.mypy.overrides]]
module = ["pandas.*"]
follow_imports = "skip"
disallow_untyped_defs = false

# Typer's command decorators are untyped third-party callables, so the strict
# `disallow_untyped_decorators` check fires on every `@app.command(...)` in the
# thin CLI layer. Relax just that check for the CLI module (its own functions stay
# fully typed); the compute core keeps the strict gate.
[[tool.mypy.overrides]]
module = ["regimehmm.cli"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
    "statsmodels.*",
    "hmmlearn.*",
    "diskcache.*",
    "plotly.*",
    "httpx.*",
    "typer.*",
]
ignore_missing_imports = true

# --------------------------------------------------------------------------- #
# pytest                                                                       #
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "unit: fast isolated unit tests",
    "property: Hypothesis property-based invariant tests",
    "parity: validation against an independent reference implementation (hmmlearn)",
    "regression: pinned-snapshot / locked-behaviour tests",
    "integration: end-to-end pipeline tests (may touch data/network)",
    "slow: long-running tests",
]

# --------------------------------------------------------------------------- #
# Coverage                                                                     #
# --------------------------------------------------------------------------- #
[tool.coverage.run]
branch = true
source = ["regimehmm"]
# The CLI and the live Polygon HTTP provider are thin I/O boundaries driven by the
# integration suite (typer entrypoints, real network), not the unit gate. Omit them
# so the coverage gate measures the pure compute core.
omit = [
    "src/regimehmm/cli.py",
    "src/regimehmm/data_providers/polygon.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "@overload",
]
